[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentinel-mcp"
version = "0.1.0"
description = "Registry-ready MCP server: deterministic claim verification, declarative policy gate, Merkle-chained WORM audit ledger, and graph memory with SQLite fallback"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Sandeep Hipparagi" }
]
keywords = [
    "mcp",
    "model-context-protocol",
    "mcp-server",
    "audit",
    "worm-ledger",
    "provenance",
    "policy-engine",
    "graph-memory",
    "agent-security",
    "llm",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
# FalkorDB backend for graph memory (SQLite fallback is built in and default).
falkordb = ["falkordb>=1.0.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.17.6",
    "mypy>=1.10",
]

[project.scripts]
sentinel-mcp = "sentinel_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/Sandeep-Hipparagi/sentinel-mcp"
Repository = "https://github.com/Sandeep-Hipparagi/sentinel-mcp"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel_mcp"]

[tool.mypy]
strict = true
warn_return_any = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = ["typer", "rich.*", "falkordb", "mcp", "mcp.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*", "test_verify_claim", "test_policy_check", "test_audit_log", "test_graph_memory", "test_server"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["SIM108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --basetemp=.pytest_tmp"
asyncio_mode = "auto"
