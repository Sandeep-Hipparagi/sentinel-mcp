name: Publish to PyPI (OIDC Trusted Publishing)

"on":
  push:
    tags:
      - "v*.*.*"
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    name: Release Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and dev tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Type check (mypy strict)
        run: mypy --strict src tests

      - name: Tests (pytest)
        run: pytest

      - name: Conformance self-test
        run: sentinel-mcp conformance

  build-and-publish:
    name: Build & Publish sentinel-mcp to PyPI
    needs: [verify]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/sentinel-mcp
    permissions:
      contents: read
      id-token: write # Mandatory for PyPI Trusted Publishing (OIDC)

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify distribution metadata (twine check)
        run: twine check dist/*

      - name: Publish package distributions to PyPI (OIDC, zero tokens)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          print-hash: true
